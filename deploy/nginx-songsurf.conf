    # >>> songsurf vhost (managed) >>>
    # SongSurf (songsurf.io). Traffic arrives only through Cloudflare (proxied DNS records);
    # the origin refuses every other address. TLS uses a Cloudflare Origin CA certificate.
    limit_req_zone $songsurf_client zone=songsurf_api:10m rate=20r/s;
    limit_req_zone $songsurf_client zone=songsurf_ws:10m rate=2r/s;
    limit_conn_zone $songsurf_client zone=songsurf_conn:10m;
    map $http_cf_connecting_ip $songsurf_client {
        default $http_cf_connecting_ip;
        ''      $binary_remote_addr;
    }

    server {
        listen 80;
        server_name songsurf.io www.songsurf.io;
        return 301 https://songsurf.io$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name www.songsurf.io;
        ssl_certificate /etc/nginx/ssl/songsurf-cert.pem;
        ssl_certificate_key /etc/nginx/ssl/songsurf-key.pem;
        return 301 https://songsurf.io$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name songsurf.io;
        ssl_certificate /etc/nginx/ssl/songsurf-cert.pem;
        ssl_certificate_key /etc/nginx/ssl/songsurf-key.pem;

        allow 173.245.48.0/20;
        allow 103.21.244.0/22;
        allow 103.22.200.0/22;
        allow 103.31.4.0/22;
        allow 141.101.64.0/18;
        allow 108.162.192.0/18;
        allow 190.93.240.0/20;
        allow 188.114.96.0/20;
        allow 197.234.240.0/22;
        allow 198.41.128.0/17;
        allow 162.158.0.0/15;
        allow 104.16.0.0/13;
        allow 104.24.0.0/14;
        allow 172.64.0.0/13;
        allow 131.0.72.0/22;
        allow 2400:cb00::/32;
        allow 2606:4700::/32;
        allow 2803:f800::/32;
        allow 2405:b500::/32;
        allow 2405:8100::/32;
        allow 2a06:98c0::/29;
        allow 2c0f:f248::/32;
        deny all;

        set $songsurf_backend http://172.17.0.1:3400;
        client_max_body_size 64k;
        limit_conn songsurf_conn 32;
        limit_req_status 429;
        limit_conn_status 429;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        gzip on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types text/css application/javascript application/json image/svg+xml;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $songsurf_client;
        proxy_set_header CF-Connecting-IP $songsurf_client;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Lobby sockets: long-lived, kept alive by the client's pings.
        location = /ws {
            limit_req zone=songsurf_ws burst=10 nodelay;
            proxy_pass $songsurf_backend;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Song audio: large, streamed straight through.
        location /api/audio/ {
            limit_req zone=songsurf_api burst=10 nodelay;
            proxy_pass $songsurf_backend;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 240s;
        }

        location /api/ {
            limit_req zone=songsurf_api burst=40 nodelay;
            proxy_pass $songsurf_backend;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass $songsurf_backend;
            proxy_set_header Connection "";
        }
    }
    # <<< songsurf vhost (managed) <<<
